imu_driver_node:
  ros__parameters:
    # IMU 串口设备路径。
    # 例：/dev/imu_usb、/dev/ttyUSB1。
    # 如果启动后 IMU 无数据，先检查该路径是否正确。
    port: "/dev/imu_usb"

    # IMU 串口波特率。
    # 常见值：9600、115200（具体看 IMU 说明书）。
    baud: 9600

    # 发布的 IMU 消息 frame_id。
    # 会写入 sensor_msgs/Imu.header.frame_id。
    frame_id: "imu_link"

    # IMU 发布话题名。
    # 控制节点默认订阅 /imu/data_raw，两个值应保持一致。
    topic_name: "/imu/data_raw"

imu_motor_controller_node:
  ros__parameters:
    # ==========================================================================
    # 话题与通信后端
    # ==========================================================================

    # 控制节点订阅的 IMU 话题。
    # 必须与 imu_driver_node.topic_name 对齐。
    imu_topic: "/imu/data_raw"

    # 统一修正和归零后的相对姿态，单位 rad。
    relative_attitude_topic: "/imu/relative_roll_pitch"

    # 每次成功归零递增，用于让 AUTO 消费方丢弃归零前缓存。
    imu_zero_generation_topic: "/imu/zero_generation"

    # 对外稳定电机模式及其心跳。
    motor_mode_topic: "/motors/control_mode"
    motor_mode_publish_rate_hz: 5.0

    # 键盘 z 与 /imu/set_zero 共用的有效姿态新鲜度上限。
    imu_zero_timeout_sec: 1.0

    # 电机通信后端：
    # - usb_can_serial：USB-CAN 串口 AT 协议
    # - socketcan_hat：SocketCAN（微雪 2-CH CAN HAT+）
    control_backend: "socketcan_hat"

    # CAN 主站 ID（控制器 ID）。
    # 大多数 CyberGear 示例使用 253（0xFD）。
    master_id: 253

    # USB-CAN 串口设备路径。
    # 使用 usb_can_serial 时生效。
    usb_port: "/dev/ttyUSB0"

    # USB-CAN 串口波特率。
    # 使用 usb_can_serial 时生效。
    usb_baud: 921600

    # 历史兼容参数（建议保留默认即可）。
    # 当前逻辑优先使用 usb_port/usb_baud。
    motor_port: "/dev/ttyUSB0"
    motor_baud: 921600

    # SocketCAN 通道名。
    # 使用 socketcan_hat 时生效。
    # 例：can0、can10、can11。
    can_channel: "can10"

    # SocketCAN 总线类型。
    # 通常固定为 socketcan。
    can_bustype: "socketcan"

    # ==========================================================================
    # 电机配置（列表形式，支持任意数量电机）
    # ==========================================================================
    #
    # 每个列表的长度必须一致，按索引一一对应。
    # control_axis 可选值：roll_left / roll_right / pitch

    motor_names: ["left_lift", "left_pitch", "right_pitch", "right_lift"]
    motor_ids: [4, 3, 2, 1]
    motor_signs: [-1.0, 1.0, -1.0, 1.0]
    motor_limits_min: [-1.57, -1.57, -1.57, 0.0]
    motor_limits_max: [0.0, 1.57, 1.57, 1.57]
    motor_control_axes: ["roll_left", "pitch", "pitch", "roll_right"]
    motor_keys_forward: ["d", "w", "k", "l"]
    motor_keys_backward: ["a", "s", "i", "j"]

    # ---- 以下为旧版标量参数（已废弃，仅供向后兼容） ----
    # left_lift_motor_id: 4
    # left_pitch_motor_id: 3
    # right_pitch_motor_id: 2
    # right_lift_motor_id: 1
    # left_lift_sign: -1.0
    # right_lift_sign: 1.0
    # left_pitch_sign: 1.0
    # right_pitch_sign: -1.0

    # ==========================================================================
    # 控制参数
    # ==========================================================================

    # CyberGear 位置模式目标速度上限初值（rad/s）。
    # 节点启动时写给每个电机；普通软件目标推进不会超过该上限。
    default_speed: 10.0

    # 姿态死区（rad）。
    # 小于该值的姿态变化会被忽略，避免抖动。
    deadband_rad: 0.02

    # 任何单周期允许的绝对位置变化保护上限（rad/次）。
    max_position_step: 0.4

    # 固定电机目标推进定时器的期望周期（秒）。
    command_interval_sec: 0.02

    # MANUAL、AUTO、HOME 的软件目标位置变化率（rad/s）。
    # 初始候选值相同，尚未经过本轮实机验证。
    manual_motion_speed_rad_s: 4.0
    auto_motion_speed_rad_s: 4.0
    home_motion_speed_rad_s: 4.0

    # 定时器延迟时允许用于单次推进计算的最大真实 dt（秒）。
    motion_dt_max_sec: 0.05

    # 软件目标到达判定容差（rad），与姿态死区用途不同。
    target_reached_tolerance_rad: 0.001

    # ==========================================================================
    # 手动调速参数
    # ==========================================================================

    # 手动调速最小值（rad/s）。
    manual_speed_min: 0.5

    # 手动调速最大值（rad/s）。
    manual_speed_max: 20.0

    # 手动调速步长（rad/s）。
    # 每按一次 +/- 的速度变化量。
    manual_speed_step: 0.5

    # ==========================================================================
    # 轴向符号修正
    # ==========================================================================

    # IMU 轴向符号修正。
    # 如果倾斜方向与预期相反，可改成 -1.0。
    roll_axis_sign: 1.0
    pitch_axis_sign: 1.0

    # ==========================================================================
    # 键盘控制
    # ==========================================================================

    # 是否启用键盘控制线程。
    enable_keyboard: true

    # 键盘设备路径。
    # 本地终端常用 /dev/tty。
    keyboard_device: "/dev/tty"

    # 不属于连续重复序列的单次 MANUAL 按键精细步进（度）。
    manual_step_deg: 3.0

    # 同一电机、同一方向字符在此间隔内再次到达时视为连续重复。
    manual_repeat_gap_sec: 0.8

    # 连续重复字符用于计算目标增量的最大事件间隔。
    manual_repeat_dt_max_sec: 0.08

    # 键盘轮询频率（Hz）。
    # 值越大按键响应越灵敏，CPU 占用略增。
    manual_loop_hz: 50.0

    # ==========================================================================
    # 旧版软限位参数（已废弃，仅供向后兼容）
    # ==========================================================================
    # 实际软限位已迁移至上方 motor_limits_min / motor_limits_max 列表。
    # 以下参数不再被读取，保留仅为避免 ROS2 参数声明警告。
    #
    # m1_min: 0.0
    # m1_max: 1.57
    # m2_min: -1.57
    # m2_max: 1.57
    # m3_min: -1.57
    # m3_max: 1.57
    # m4_min: -1.57
    # m4_max: 0.0

    # ==========================================================================
    # 通信看门狗
    # ==========================================================================

    # IMU 数据超时阈值（毫秒）。
    # 如果 IMU 数据超过该时间未更新，系统自动切换到手动模式并保持当前位置。
    # 设为 0 表示禁用看门狗（不推荐）。
    watchdog_timeout_ms: 200

    # ==========================================================================
    # 电机温度保护
    # ==========================================================================

    # 电机温度警告阈值（摄氏度）。
    # 超过此温度，电机会自动降速到 manual_speed_min。
    motor_temp_limit_degC: 80.0

    # 电机温度紧急阈值（摄氏度）。
    # 超过此温度，电机立即停机（需手动恢复）。
    motor_temp_critical_degC: 90.0

    # ==========================================================================
    # 电机电流保护
    # ==========================================================================

    # 电机电流保护阈值（安培）。
    # 超过此电流，该电机的目标位置更新会被暂停。
    motor_current_limit_a: 5.0

    # ==========================================================================
    # 位置误差监控
    # ==========================================================================

    # 位置误差警告阈值（弧度）。
    # 当电机实际位置与目标位置的偏差超过此值时，输出警告日志。
    position_error_threshold_rad: 0.3

    # 同类、同一电机告警的最小日志间隔，避免反馈频率较高时刷屏。
    warning_throttle_sec: 2.0

    # ==========================================================================
    # 自动重连
    # ==========================================================================

    # 是否在检测到电机断开后自动重连。
    reconnect_on_disconnect: true

    # ==========================================================================
    # 话题配置
    # ==========================================================================

    # 电机状态发布话题名。
    # 格式："motor_id,pos_rad,speed_rad_s,torque_nm,temp_C,mode_name,fault_hex"
    # 示例："1,0.5234,-0.1000,1.200,35.0,运行,0x00"
    motor_status_topic: "/motor/status"
