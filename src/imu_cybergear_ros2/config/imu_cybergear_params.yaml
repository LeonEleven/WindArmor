imu_driver_node:
  ros__parameters:
    # IMU 串口设备路径。
    # 例：/dev/imu_usb、/dev/ttyUSB1。
    # 如果启动后 IMU 无数据，先检查该路径是否正确。
    port: "/dev/imu_usb"

    # IMU 串口波特率。
    # 常见值：9600、115200（具体看 IMU 说明书）。
    baud: 9600

    # 发布的 IMU 消息 frame_id。
    # 会写入 sensor_msgs/Imu.header.frame_id。
    frame_id: "imu_link"

    # IMU 发布话题名。
    # 控制节点默认订阅 /imu/data_raw，两个值应保持一致。
    topic_name: "/imu/data_raw"

imu_motor_controller_node:
  ros__parameters:
    # ==========================================================================
    # 话题与通信后端
    # ==========================================================================

    # 控制节点订阅的 IMU 话题。
    # 必须与 imu_driver_node.topic_name 对齐。
    imu_topic: "/imu/data_raw"

    # 统一修正和归零后的相对姿态，单位 rad。
    relative_attitude_topic: "/imu/relative_roll_pitch"

    # 每次成功归零递增，用于让 AUTO 消费方丢弃归零前缓存。
    imu_zero_generation_topic: "/imu/zero_generation"

    # 对外稳定电机模式及其心跳。
    motor_mode_topic: "/motors/control_mode"
    motor_mode_publish_rate_hz: 5.0

    # 键盘 z 与 /imu/set_zero 共用的有效姿态新鲜度上限。
    imu_zero_timeout_sec: 1.0

    # 电机通信后端：
    # - usb_can_serial：USB-CAN 串口 AT 协议
    # - socketcan_hat：SocketCAN（微雪 2-CH CAN HAT+）
    control_backend: "socketcan_hat"

    # CAN 主站 ID（控制器 ID），必须是 0～255 的整数且不得与 motor_ids 重复。
    # 大多数 CyberGear 示例使用 253（0xFD）。
    master_id: 253

    # USB-CAN 串口设备路径。
    # 使用 usb_can_serial 时生效。
    usb_port: "/dev/ttyUSB0"

    # USB-CAN 串口波特率。
    # 使用 usb_can_serial 时生效。
    usb_baud: 921600

    # 历史 fallback 参数。新参数非空/非零时始终优先；仅当 usb_port 为空或
    # usb_baud 为 0 时才使用对应旧参数，并输出一次明确的废弃警告。
    motor_port: "/dev/ttyUSB0"
    motor_baud: 921600

    # SocketCAN 通道名。
    # 使用 socketcan_hat 时生效。
    # 例：can0、can10、can11。
    can_channel: "can10"

    # SocketCAN 总线类型。
    # 通常固定为 socketcan。
    can_bustype: "socketcan"

    # ==========================================================================
    # 电机配置（列表形式，支持任意数量电机）
    # ==========================================================================
    #
    # 每个列表必须非空、长度一致并按索引一一对应。ID 必须在 1～127 且唯一；
    # 名称必须非空且唯一；sign 只能为 +/-1；软限位必须有限、严格递增且位于
    # [-4π, +4π]；control_axis 只能是 roll_left / roll_right / pitch。
    # 前进/后退键必须是全局唯一的小写单字符，且不得与固定控制键或数字选中键冲突。

    motor_names: ["left_lift", "left_pitch", "right_pitch", "right_lift"]
    motor_ids: [4, 3, 2, 1]
    motor_signs: [-1.0, 1.0, -1.0, 1.0]
    motor_limits_min: [-1.57, -1.57, -1.57, 0.0]
    motor_limits_max: [0.0, 1.57, 1.57, 1.57]
    motor_control_axes: ["roll_left", "pitch", "pitch", "roll_right"]
    motor_keys_forward: ["d", "w", "k", "l"]
    motor_keys_backward: ["a", "s", "i", "j"]

    # ---- 以下为旧版标量参数（已废弃） ----
    # 保持声明默认值可正常配置；任何非默认设置都会使配置失败，并提示改用列表参数。
    # left_lift_motor_id: 4
    # left_pitch_motor_id: 3
    # right_pitch_motor_id: 2
    # right_lift_motor_id: 1
    # left_lift_sign: -1.0
    # right_lift_sign: 1.0
    # left_pitch_sign: 1.0
    # right_pitch_sign: -1.0

    # ==========================================================================
    # 控制参数
    # ==========================================================================

    # CyberGear 位置模式目标速度上限初值（rad/s）。
    # 节点启动时写给每个电机；普通软件目标推进不会超过该上限。
    default_speed: 10.0

    # 姿态死区（rad）。
    # 小于该值的姿态变化会被忽略，避免抖动。
    deadband_rad: 0.02

    # AUTO 模式姿态目标增益。
    # 1.0 保持真实相对姿态与电机目标之间的当前比例。
    auto_roll_gain: 1.0
    auto_pitch_gain: 1.0

    # 任何单周期允许的绝对位置变化保护上限（rad/次）。
    max_position_step: 0.4

    # 固定电机目标推进定时器的期望周期（秒）。
    command_interval_sec: 0.02

    # MANUAL、AUTO、HOME、FLIGHT 的软件目标位置变化率（rad/s）。
    # RC 冻结值相同；已进行正常功能回归，但尚未完成精确机械速度标定。
    manual_motion_speed_rad_s: 4.0
    auto_motion_speed_rad_s: 4.0
    home_motion_speed_rad_s: 4.0
    flight_motion_speed_rad_s: 4.0

    # 定时器延迟时允许用于单次推进计算的最大真实 dt（秒）。
    motion_dt_max_sec: 0.05

    # 软件目标到达判定容差（rad），与姿态死区用途不同。
    target_reached_tolerance_rad: 0.001

    # ==========================================================================
    # 手动调速参数
    # ==========================================================================

    # 手动调速最小值（rad/s）。
    manual_speed_min: 0.5

    # 手动调速最大值（rad/s）。
    manual_speed_max: 20.0

    # 手动调速步长（rad/s）。
    # 每按一次 +/- 的速度变化量。
    manual_speed_step: 0.5

    # ==========================================================================
    # 轴向符号修正
    # ==========================================================================

    # IMU 轴向符号修正。
    # 如果倾斜方向与预期相反，可改成 -1.0。
    roll_axis_sign: 1.0
    pitch_axis_sign: 1.0

    # ==========================================================================
    # 键盘控制
    # ==========================================================================

    # 是否启用键盘控制线程。
    enable_keyboard: true

    # 键盘设备路径。
    # 本地终端常用 /dev/tty。
    keyboard_device: "/dev/tty"

    # 不属于连续重复序列的单次 MANUAL 按键精细步进（度）。
    manual_step_deg: 3.0

    # 同一电机、同一方向字符在此间隔内再次到达时视为连续重复。
    manual_repeat_gap_sec: 0.8

    # 连续重复字符用于计算目标增量的最大事件间隔。
    manual_repeat_dt_max_sec: 0.08

    # 键盘轮询频率（Hz）。
    # 值越大按键响应越灵敏，CPU 占用略增。
    manual_loop_hz: 50.0

    # ==========================================================================
    # 旧版软限位参数（已废弃，仅供向后兼容）
    # ==========================================================================
    # 实际软限位已迁移至上方 motor_limits_min / motor_limits_max 列表。
    # 以下参数只允许保持声明默认值；非默认设置会使配置失败并提示列表迁移目标。
    #
    # m1_min: 0.0
    # m1_max: 1.57
    # m2_min: -1.57
    # m2_max: 1.57
    # m3_min: -1.57
    # m3_max: 1.57
    # m4_min: -1.57
    # m4_max: 0.0

    # ==========================================================================
    # 通信看门狗
    # ==========================================================================

    # IMU 数据超时阈值（毫秒）。
    # 如果 IMU 数据超过该时间未更新，系统自动切换到手动模式并保持当前位置。
    # 设为 0 表示禁用看门狗（不推荐）。
    watchdog_timeout_ms: 200

    # ==========================================================================
    # 电机温度保护
    # ==========================================================================

    # 电机温度 warning 阈值（摄氏度）；达到后仅限频告警，不自动降速。
    motor_temp_limit_degC: 80.0

    # 临界温度阈值（摄氏度）；单帧合法反馈达到后停止全部电机、锁存并进入 ERROR。
    motor_temp_critical_degC: 90.0

    # ==========================================================================
    # 电机电流保护
    # ==========================================================================

    # 保留参数，必须是大于 0 的有限值。0x02 反馈没有数值 current_a，本参数
    # 当前不参与安培阈值比较；实际保护依赖固件报告的过流 fault bit。
    # 禁止从 torque_nm/raw_torque 推导电流。
    motor_current_limit_a: 5.0

    # ==========================================================================
    # 电机反馈合法性与新鲜度
    # ==========================================================================

    # 单台电机连续无效反馈达到该正整数次数后，停止全部电机并进入 ERROR。
    motor_invalid_feedback_limit: 3

    # 合法反馈超时阈值（秒），必须是非负有限值。0.0 表示关闭强制超时保护；
    # 当前代码无法证明电机空闲时持续周期上报，因此默认禁用，仅记录本地反馈年龄。
    motor_feedback_timeout_sec: 0.0

    # 每次 lifecycle 激活后的首次反馈宽限时间（秒），必须为正有限值；仅在 timeout
    # 大于 0 时参与强制保护。
    motor_feedback_startup_grace_sec: 3.0

    # 启用强制反馈超时后的检查频率（Hz），必须为正有限值。
    motor_feedback_check_rate_hz: 10.0
    # Normal active controller re-sends each current authoritative hold target
    # unchanged at this rate. CyberGear communication type 18 responds with a
    # complete type-2 status frame; this is not a new command authority.
    motor_feedback_acquisition_rate_hz: 10.0

    # ==========================================================================
    # 位置误差监控
    # ==========================================================================

    # 位置误差警告阈值（弧度）。
    # 当电机实际位置与目标位置的偏差超过此值时，输出警告日志。
    position_error_threshold_rad: 0.3

    # 同类、同一电机告警的最小日志间隔，避免反馈频率较高时刷屏。
    warning_throttle_sec: 2.0

    # ==========================================================================
    # 自动重连
    # ==========================================================================

    # true：明确 transport fault 后进入 ERROR，并在后台仅尝试重开 transport/reader。
    # false：进入 ERROR、尽力停止并关闭失效 transport，但不尝试后台重连。
    # 即使通信恢复成功也保持 ERROR，不初始化电机、不恢复旧目标或任何运动。
    reconnect_on_disconnect: true

    # 运行期 transport-only 重连采用有界指数退避；首次尝试立即执行，以下 delay
    # 用于失败尝试之间。cleanup/shutdown/deactivate 会中断等待并取消后续尝试。
    reconnect_max_attempts: 30
    reconnect_initial_delay_sec: 0.5
    reconnect_max_delay_sec: 10.0
    reconnect_backoff_multiplier: 1.5

    # ==========================================================================
    # 话题配置
    # ==========================================================================

    # 电机状态发布话题名。
    # 格式："motor_id,pos_rad,speed_rad_s,torque_nm,temp_C,mode_name,fault_hex"
    # 示例："1,0.5234,-0.1000,1.200,35.0,运行,0x00"
    motor_status_topic: "/motor/status"

    # Flight/diagnostic observer-only structured snapshot. These settings never
    # change motor safety decisions or motor_feedback_timeout_sec.
    motor_feedback_structured_topic: "/motors/feedback"
    motor_safety_state_topic: "/motors/safety_state"
    motor_ownership_state_topic: "/motors/ownership_state"
    motor_flight_prepare_service: "/motors/flight_ownership/prepare"
    motor_flight_commit_service: "/motors/flight_ownership/commit"
    motor_flight_revoke_service: "/motors/flight_ownership/revoke"
    flight_command_topic: "/flight_control/command"
    # Positive monotonic seconds from reserve through the first valid Flight envelope.
    # Exceeds the default 1.0 s Runtime transaction timeout; not hardware-tuned.
    motor_flight_handoff_timeout_sec: 1.5
    # Positive monotonic ACTIVE heartbeat seconds after the first valid normal envelope.
    # Independent of handoff timing; this default is not hardware-tuned.
    motor_flight_command_timeout_sec: 0.25
    motor_feedback_publish_rate_hz: 10.0
    motor_feedback_observer_freshness_sec: 0.5

# Task 6.1 observation-only adapters. These sections are intentionally separate
# from imu_motor_controller_node so the observation launch never constructs the
# controller, MotorManager, keyboard, ownership, homing or set-zero interfaces.
imu_relative_observer_node:
  ros__parameters:
    imu_topic: "/imu/data_raw"
    relative_attitude_topic: "/imu/relative_roll_pitch"
    imu_zero_generation_topic: "/imu/zero_generation"
    roll_axis_sign: 1.0
    pitch_axis_sign: 1.0

motor_feedback_observer_node:
  ros__parameters:
    # connect opens only the receive transport/reader. SocketCAN sends no frame;
    # USB-CAN may write adapter AT setup commands but no CyberGear CAN command.
    control_backend: "socketcan_hat"
    master_id: 253
    usb_port: "/dev/ttyUSB0"
    usb_baud: 921600
    can_channel: "can10"
    can_bustype: "socketcan"

    # Must remain identical to the controller's protected logical-name/ID map.
    motor_names: ["left_lift", "left_pitch", "right_pitch", "right_lift"]
    motor_ids: [4, 3, 2, 1]

    motor_feedback_structured_topic: "/motors/feedback"
    motor_feedback_observer_status_topic: "/motors/observer_status"
    motor_feedback_publish_rate_hz: 10.0
    motor_feedback_observer_freshness_sec: 0.5
    motor_temp_limit_degC: 80.0
    motor_temp_critical_degC: 90.0
    motor_invalid_feedback_limit: 3

    # Initial transport open only. Runtime disconnect is reported and closed;
    # automatic reconnect is disabled to keep Stage 1 behavior auditable.
    observer_connect_max_attempts: 1
    observer_connect_initial_delay_sec: 0.5
