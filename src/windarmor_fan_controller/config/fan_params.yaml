fan_controller:
  ros__parameters:
    # BCM GPIO 编号。GPIO12=物理 32 脚，GPIO13=物理 33 脚。
    left_gpio: 12
    right_gpio: 13

    # 已通过前置项目实机验证的电调脉宽范围。
    min_pwm_us: 800
    max_pwm_us: 2200
    stop_pwm_us: 800
    frame_width_sec: 0.020
    arm_delay_sec: 3.0

    # 超过该时间未收到 /fans/command_pwm 时自动回到最低油门。
    # 必须是严格大于 0 的有限数值；安全看门狗不可通过参数关闭。
    command_timeout_sec: 1.0

    # enabled 状态使用可靠、transient-local QoS，并以该频率发送心跳。
    enabled_status_publish_rate_hz: 5.0

    # 急停后键盘仍发送心跳时，最多每 5 秒提示一次“风扇已停用”。
    warning_throttle_sec: 5.0

fan_command_manager:
  ros__parameters:
    # 管理器不访问 GPIO；公共手动命令和 AUTO 命令都先经过此处仲裁。
    min_pwm_us: 800
    max_pwm_us: 2200
    fan_stop_pwm_us: 800
    fan_start_pwm_us: 1200
    fan_auto_max_pwm_us: 1400
    # Flight normalized requests remain bounded by the existing AUTO maximum.
    flight_fan_max_pwm_us: 1400

    auto_enabled_at_start: false
    fan_deadband_on_deg: 5.0
    fan_deadband_off_deg: 3.0
    fan_full_scale_deg: 45.0

    # AUTO 活动角到目标 PWM 的归一化响应曲线。
    # 支持：linear、smoothstep、quadratic。
    fan_response_curve: "smoothstep"
    control_rate_hz: 20.0
    status_publish_rate_hz: 5.0
    rise_step_pwm_us: 10
    fall_step_pwm_us: 20

    imu_timeout_sec: 0.2
    manual_command_timeout_sec: 0.5
    motor_mode_timeout_sec: 1.0
    fan_enabled_timeout_sec: 1.0

    # 保留现有 launch 参数兼容；显式 MANUAL 授权始终要求新鲜合法电机模式。
    # 统一 bringup 继续覆盖为 true。
    require_motor_mode_for_manual: false

    # Positive monotonic seconds from reserve through the first valid Flight envelope.
    # Exceeds the default 1.0 s Runtime transaction timeout; not hardware-tuned.
    fan_flight_handoff_timeout_sec: 1.5
    # Positive monotonic ACTIVE heartbeat seconds after the first valid normal envelope.
    # Invalid commands do not refresh it; this default is not hardware-tuned.
    fan_flight_command_timeout_sec: 0.25
    fan_ownership_state_topic: "/fans/ownership_state"
    fan_flight_prepare_service: "/fans/flight_ownership/prepare"
    fan_flight_commit_service: "/fans/flight_ownership/commit"
    fan_flight_revoke_service: "/fans/flight_ownership/revoke"
    flight_command_topic: "/flight_control/command"
    flight_motor_names: ["left_lift", "left_pitch", "right_pitch", "right_lift"]

fan_keyboard:
  ros__parameters:
    min_pwm_us: 800
    max_pwm_us: 2200
    step_pwm_us: 20
